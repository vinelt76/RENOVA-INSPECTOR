name: Build Artifacts

# Workflow por defecto del repo: en cada push a `main` genera el APK debug de la
# app y, si existe, el preview HTML del dashboard, y los deja descargables como
# artifacts del run. No usa GitHub Pages ni crea Releases.

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite lanzar manualmente desde GitHub o celular

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: cd app && npm ci

      - name: Build web assets
        run: cd app && npm run build

      - name: Sync Capacitor → Android
        run: cd app && npx cap sync android

      - name: Make gradlew executable
        run: chmod +x app/android/gradlew

      - name: Build debug APK
        run: cd app/android && ./gradlew assembleDebug --no-daemon

      - name: Verify APK was generated
        run: |
          APK_PATH="app/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::No se encontró el APK en $APK_PATH — el build falló silenciosamente."
            exit 1
          fi
          echo "APK verificado: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RENOVA-Inspector-Debug-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Prepare dashboard preview (si existe)
        id: dashboard
        run: |
          shopt -s nullglob
          mkdir -p dashboard-preview
          matches=(UI/*[Dd]ashboard*.html UI/*[Pp]anel*[Tt]aller*.html)
          if [ ${#matches[@]} -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No se encontró un HTML de dashboard en UI/ — se omite este paso sin fallar el workflow."
          else
            cp "${matches[@]}" dashboard-preview/
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Dashboard preview encontrado:"
            ls -la dashboard-preview/
          fi

      - name: Upload dashboard preview artifact
        if: steps.dashboard.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RENOVA-Dashboard-Preview
          path: dashboard-preview/
          retention-days: 14

      - name: Build summary
        run: |
          echo "## Build de artifacts ✓" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- APK debug: **RENOVA-Inspector-Debug-APK**" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.dashboard.outputs.found }}" = "true" ]; then
            echo "- Dashboard preview: **RENOVA-Dashboard-Preview**" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Dashboard preview: omitido (no se encontró HTML de dashboard en UI/)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Descargá los artifacts desde la pestaña **Artifacts** de este run." >> $GITHUB_STEP_SUMMARY
