name: Web Preview

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Build
        run: cd app && npm run build
        env:
          # base URL para GitHub Pages: /RENOVA-INSPECTOR/
          VITE_BASE: /RENOVA-INSPECTOR/

      - name: Agregar dashboards HTML al sitio publicado
        # Los dashboards de solo lectura (protegidos por RLS + login, ver
        # supabase/migrations/20260710090000_dashboard_public_rls.sql) viven
        # en WEB/, todos al mismo nivel (rutas relativas entre ellos sin ../).
        # Se copian bajo dist/web/ para no chocar con index.html/assets/ de
        # la SPA, que sigue sirviéndose en la raíz.
        run: |
          mkdir -p app/dist/web
          cp WEB/*.html WEB/*.js WEB/*.css app/dist/web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
