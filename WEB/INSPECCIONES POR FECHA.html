<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>RENOVA — Inspecciones</title>
<!--
  PANTALLA INSPECCIONES — lista de neumáticos filtrable (F4, tasks_filtros_facetados/task_06).
  Autocontenida: abrir directamente en el navegador. Datos reales desde Supabase/Excel.

  Antes de esta fase listaba UNIDADES particionadas por fecha (dateSelect indexaba
  el render). Ahora lista NEUMÁTICOS: unidad, posición y fecha son atributos de cada
  fila, filtrables con chips (unidad, código, estado, fecha, observación de
  reencauche). Sin chips: última fecha global. Con unidad: última inspección de
  esa unidad. Una fecha explícita permite consultar historia. Cada fila sigue
  abriendo la inspección YA EXISTENTE de su unidad (openInspection(), pantalla aparte).

  Regla de color: calculada 100% server-side en Supabase (v_inspection_dashboard_rows,
  tire_status — misma lógica que v_unit_tire_status, umbrales efectivos de empresa vía
  fn_effective_rtd_thresholds). Este HTML SOLO lee tire_status/retread_observation y
  renderiza — no recalcula umbrales en JS:
    · Anomalía causal de retiro: is_discard (check manual) O anomaly_catalog.desecho
      (texto de la anomalía coincide con una entrada grave del catálogo)  → CRÍTICO (naranja)
    · RTD remanente ≤ rtd_change_mm          → CRÍTICO (naranja)
    · RTD remanente ≤ rtd_next_mm            → OBSERVACIÓN (amarillo)
    · resto                                  → NORMAL (verde)
    · sin RTD/umbral disponible              → SIN DATOS (azul neutro)
  (Semáforo del negocio, DESIGN.md §8: el naranja ES la máxima severidad; no se usa rojo.)
  El color es ahora por NEUMÁTICO (tire_status), no el peor caso de la unidad.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<!-- Supabase: config pública (RLS protege por empresa) + adaptador con login.
     Sin config o sin red, la pantalla no inventa datos. -->
<script src="supabase-config.public.js"></script>
<script src="renova-ready.js"></script>
<script src="renova-animate.js"></script>
<script type="module" src="supabase-demo.js"></script>
<link rel="stylesheet" href="renova-office-shell.css">
<link rel="stylesheet" href="buscador/buscador.css">
<link rel="stylesheet" href="shared/filter-bar.css">
<style>
  :root{
    /* Semáforo del negocio (DESIGN.md §8): verde Normal · amarillo Observación · naranja Crítico.
       El naranja ES la máxima severidad del sistema; no se introduce rojo. Máxima
       separación de hue entre los 3 estados => lectura rápida sobre muchas unidades. */
    --crit:var(--ember-orange);        /* Crítico      = ember-orange */
    --crit-bg:rgba(240,104,34,.14);
    --warn:var(--signal-yellow);       /* Observación  = signal-yellow */
    --warn-bg:rgba(244,184,33,.14);
    --normal:var(--verified-green);    /* Normal       = verified-green */
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .num{font-variant-numeric:tabular-nums}

  .head-row{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;max-width:1200px;margin:0 auto;
  }
  .brand .subtitle{
    font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--label-blue);margin-top:8px;
  }
  .header-tools{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:flex-end}

  /* ───────────────── Layout ───────────────── */
  main{max-width:1200px;margin:0 auto;padding:16px;flex:1 0 auto;width:100%}

  /* ───────────────── Filtro facetado (F1/F4, tasks_filtros_facetados) ───────────────── */
  .filter-block{margin-bottom:18px;position:relative;max-width:1200px}
  .filter-block .selector-label{
    font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--label-blue);margin-bottom:9px;
  }

  /* ───────────────── KPIs: panel gráfico de flota ─────────────────
     Reemplaza las 5 stat cards de texto por un panel único (total +
     distribución + riesgo) — ver design-principle.md "Graphic-first
     dashboard principle". Barra segmentada, nunca torta (DESIGN.md §8). */
  .kpis{margin-bottom:22px}

  @keyframes panelIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .fleet-overview{
    display:grid;grid-template-columns:200px 1fr 220px;gap:24px;align-items:center;
    background:var(--field-dark);border:2px solid var(--border-dark);border-radius:14px;
    padding:20px 24px;animation:panelIn .3s ease-out both;
  }
  .fo-total-value{font-size:44px;font-weight:800;line-height:1;color:var(--value-ice)}
  .fo-total-label{
    font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--label-blue);margin-top:8px;
  }
  .fo-total-sub{
    font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--label-blue);margin-top:4px;
    text-transform:uppercase;
  }

  .fo-dist-label{
    font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--label-blue);margin-bottom:10px;
  }
  .severity-bar{
    display:flex;height:30px;border-radius:8px;overflow:hidden;
    background:var(--screen-dark);border:2px solid var(--border-dark);
  }
  .sb-seg{height:100%;flex:0 0 0%;transition:flex-basis .7s cubic-bezier(.22,1,.36,1)}
  .sb-seg.crit{background:var(--crit)}
  .sb-seg.warn{background:var(--warn)}
  .sb-seg.normal{background:var(--verified-green)}
  .sb-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
  .sb-legend span{
    display:flex;align-items:center;gap:6px;
    font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--label-blue);
  }
  .sb-legend b{color:var(--value-ice);font-size:12px}
  .sb-legend .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .sb-legend .dot.crit{background:var(--crit)}
  .sb-legend .dot.warn{background:var(--warn)}
  .sb-legend .dot.normal{background:var(--verified-green)}

  .fo-risk{display:flex;align-items:center;gap:14px;justify-content:flex-end}
  .risk-ring{
    --pct:0%;width:78px;height:78px;border-radius:50%;flex:none;position:relative;
    background:conic-gradient(var(--crit) var(--pct),var(--border-dark) 0);
  }
  .risk-ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--field-dark)}
  .risk-ring .rr-value{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:800;color:var(--value-ice);z-index:1;
  }
  .fo-risk-text{text-align:right}
  .fo-risk-label{
    font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--label-blue);
  }
  .fo-risk-sub{font-size:10px;font-weight:700;color:var(--label-blue);margin-top:4px}

  @media (max-width:760px){
    .fleet-overview{grid-template-columns:1fr;text-align:left}
    .fo-risk{justify-content:flex-start}
  }

  /* ───────────────── Sección ───────────────── */
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;margin-bottom:12px;
  }
  .section-head h2{
    font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--label-blue);
  }

  /* ───────────────── Grid de unidades ───────────────── */
  .fleet-grid{
    display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
  }
  .unit-card{
    background:var(--field-dark);
    border:2px solid var(--border-dark);
    border-radius:12px;
    padding:12px 12px 11px;
    cursor:pointer;
    display:flex;flex-direction:column;gap:10px;
    transition:transform .12s ease-out,border-color .15s ease-out,background .15s ease-out;
    text-align:left;font-family:var(--mono);
  }
  .unit-card:hover{background:#132538}
  .unit-card:focus-visible{outline:none;border-color:var(--value-ice)}
  .unit-card.pressable:active{transform:scale(.97)}
  .unit-card.status-critical{border-color:var(--crit);background:linear-gradient(180deg,var(--crit-bg),transparent 60%),var(--field-dark)}
  .unit-card.status-warning{border-color:var(--warn);background:linear-gradient(180deg,var(--warn-bg),transparent 60%),var(--field-dark)}

  .uc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .uc-plate{font-size:20px;font-weight:800;line-height:1;color:var(--value-ice);letter-spacing:.02em;overflow-wrap:anywhere}
  .uc-meta{font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--label-blue);margin-top:5px;text-transform:uppercase}
  .uc-dot{width:11px;height:11px;border-radius:50%;flex:none;margin-top:3px}
  .status-critical .uc-dot{background:var(--crit);box-shadow:0 0 0 3px var(--crit-bg)}
  .status-warning  .uc-dot{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
  .status-normal   .uc-dot{background:var(--verified-green);box-shadow:0 0 0 3px rgba(31,157,107,.15)}
  .status-no_data  .uc-dot{background:var(--label-blue);box-shadow:0 0 0 3px rgba(122,171,204,.15)}

  /* Card simplificada — ahora por NEUMÁTICO (antes por unidad, ver
     design-principle.md Goal 2.4): código/placa/posición y un estado
     grande por color. */
  .uc-config{
    font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--label-blue);
    text-transform:uppercase;
  }
  .uc-retread{
    font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--signal-yellow);
    text-transform:uppercase;
  }
  .uc-history-note{font-size:9px;font-weight:800;letter-spacing:.05em;color:var(--label-blue);text-transform:uppercase}
  .uc-status{
    margin-top:auto;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);
    font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  }
  .status-critical .uc-status{color:var(--crit)}
  .status-warning  .uc-status{color:var(--warn)}
  .status-normal   .uc-status{color:var(--verified-green)}
  .status-no_data  .uc-status{color:var(--label-blue)}

  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .unit-card{animation:cardIn .28s ease-out both}

  .empty{
    grid-column:1/-1;text-align:center;color:var(--label-blue);
    font-size:12px;padding:40px 0;border:2px dashed var(--border-dark);border-radius:12px;
  }

  footer{
    max-width:1200px;margin:24px auto 0;padding:0 16px;
    font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--label-blue);opacity:.7;text-align:center;
  }

  @media (max-width:520px){
    .brand .logo{font-size:26px}
    .header-tools{width:100%;justify-content:flex-start}
    .screen-nav{width:100%}
    .uc-plate{font-size:18px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>

<header>
  <div class="head-row office-head">
    <div class="brand">
      <div class="logo">RENOVA<b>·</b></div>
      <div class="screen-name">INSPECCIONES</div>
    </div>
    <div class="header-tools">
      <nav class="screen-nav" aria-label="Pantallas">
        <a class="active" href="INSPECCIONES%20POR%20FECHA.html">Inspecciones</a>
        <a href="inventario.html">Inventario</a>
        <a href="servicios.html">Servicios</a>
        <a href="rendimiento.html">Rendimiento</a>
        <a href="importar.html">Importar</a>
      </nav>
      <button class="finder-trigger" data-finder-trigger type="button" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K">
        Buscar unidad o neumático <kbd>Ctrl K</kbd>
      </button>
    </div>
  </div>
</header>

<main>
  <!-- Sin fecha/unidad: última fecha global. Unidad: última inspección de esa
       unidad. Un chip de fecha es la salida explícita hacia el histórico. -->
  <div class="filter-block">
    <div class="selector-label">Filtrar neumáticos</div>
    <div id="filterMount"></div>
  </div>

  <!-- KPIs -->
  <section class="kpis" id="kpis" aria-label="Resumen del conjunto filtrado"></section>

  <!-- Grid -->
  <div class="section-head">
    <h2 id="gridTitle">Neumáticos inspeccionados</h2>
  </div>

  <section class="fleet-grid" id="fleetGrid" aria-live="polite"></section>
</main>

<footer>Datos del Excel · Regla de color por neumático (tire_status, igual lógica que Vista de Flota)</footer>

<script>
/* Dataset activo: SOLO datos reales desde Supabase/Excel. Una fila por
   neumático inspeccionado (F4, task_06) — antes era una fila por unidad. */
let TIRE_ROWS = [];
let currentResultTires = []; // última lista filtrada renderizada (para abrir por índice)
let CURRENT_SCOPE = { label: "Última fecha" };

/* =========================================================================
   DATOS REALES (Supabase) — v_inspection_dashboard_rows: una fila por
   posición medida (task_01 corrigió la fuente: v_fleet_unit_status agregaba
   por unidad, sirve para "peor caso" pero no para listar neumáticos).
   tire_status/retread_observation ya vienen calculados server-side con los
   umbrales efectivos de empresa (fn_effective_rtd_thresholds) — mismo motor
   que usaba v_unit_tire_status. El HTML solo lee y renderiza, no recalcula
   umbrales en JS.
   ========================================================================= */
function buildTireInspectionRowsFromSupabase(rows){
  return rows.map(r => ({
    inspectionId: r.inspection_id, unitId: r.unit_id, plate: r.plate, companyName: r.company_name,
    inspectedOn: r.inspected_on,
    positionNumber: Number(r.position_number),
    pos: "P" + r.position_number, lado: r.side || null, axleName: r.axle_type || null,
    tireCode: r.tire_code || null, casingCode: r.casing_code || null,
    brand_name: r.brand_name || null, model_name: r.model_name || null, size_name: r.size_name || null,
    condition: r.condition || null, retread_design: r.retread_design || null,
    tireStatus: r.tire_status || "no_data",
    retreadObservation: r.retread_observation || null,
    // La vista decide Desecho con el catálogo de anomalías o el descarte
    // manual. Solo se muestra la razón que vino de esa decisión; no se
    // recalcula en el cliente.
    discardReason: r.retread_observation === "desecho" ? (r.anomaly || "Descarte marcado") : null,
    rtdMoviMm: r.rtd_movi_mm != null ? Number(r.rtd_movi_mm) : null,
  }));
}

// Navegación → abre la inspección YA EXISTENTE de la unidad de esa fila.
// No se crea inspección nueva ni se duplica el gemelo digital aquí. Varias
// filas (posiciones) de la misma unidad+fecha abren la MISMA inspección, pero
// conservan la posición elegida para enfocar ese neumático en el visor 3D.
function openInspection(tire){
  const qs = new URLSearchParams({
    inspection_id: tire.inspectionId,
    plate: tire.plate,
    date: tire.inspectedOn,
  });
  if(Number.isInteger(tire.positionNumber) && tire.positionNumber > 0){
    qs.set("pos", String(tire.positionNumber));
  }
  location.href = `Inspecciones por unidad.html?${qs.toString()}`;
}

function openResultRow(index){
  const tire = currentResultTires[index];
  if(tire) openInspection(tire);
}

/* =========================================================================
   RENDER
   ========================================================================= */

const STATUS_LABEL = { critical:"Crítica", warning:"Observación", normal:"Normal", no_data:"Sin datos" };
const RETREAD_LABEL = { para_reencauche:"Para reencauche", proximo_a_reencauche:"Próximo a reencauche", desecho:"Desecho" };

function formatDate(iso){
  if(!iso) return "—";
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio",
                 "agosto","septiembre","octubre","noviembre","diciembre"];
  const [y,m,d] = iso.split("-").map(Number);
  return `${d} ${meses[m-1]} ${y}`;
}

function renderNoData(message){
  TIRE_ROWS = [];
  currentResultTires = [];
  document.getElementById("kpis").innerHTML =
    `<div class="fleet-overview"><div class="fo-total">
      <div class="fo-total-value num">0</div>
      <div class="fo-total-label">Neumáticos inspeccionados</div>
      <div class="fo-total-sub">Sin datos</div>
    </div></div>`;
  document.getElementById("gridTitle").textContent = "Neumáticos inspeccionados · 0";
  document.getElementById("fleetGrid").innerHTML =
    `<div class="empty">${message}</div>`;
}

/* =========================================================================
   ANIMACIÓN — utilidades mínimas (conteo ascendente, crecimiento de barras
   y anillo de riesgo). Respetan prefers-reduced-motion: en ese caso el
   valor final se aplica de inmediato, sin pasos intermedios.
   ========================================================================= */
const REDUCED_MOTION = window.matchMedia &&
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const animateCount = RenovaAnimate.count;
const growFill = RenovaAnimate.growFill;

function animateRing(el, toPct, duration=700){
  if(!el) return;
  if(REDUCED_MOTION){ el.style.setProperty("--pct", toPct + "%"); return; }
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.style.setProperty("--pct", (toPct * eased) + "%");
    if(p < 1) requestAnimationFrame(tick); else el.style.setProperty("--pct", toPct + "%");
  }
  requestAnimationFrame(tick);
}

// Panel único: total (número) + distribución de severidad (barra segmentada,
// nunca torta — DESIGN.md §8) + riesgo del conjunto (anillo). Ahora cuenta
// NEUMÁTICOS del conjunto filtrado, no unidades. Los "sin datos" (tire_status
// no_data) se muestran aparte: no son "normales" — F10, no inventar 0/normal
// donde no hay clasificación posible.
function renderKpis(tires, chips, scope){
  const total = tires.length;
  let crit=0, warn=0, normal=0, sinDatos=0;
  tires.forEach(t=>{
    if(t.tireStatus==="critical") crit++;
    else if(t.tireStatus==="warning") warn++;
    else if(t.tireStatus==="normal") normal++;
    else sinDatos++;
  });
  const atRisk = crit + warn;
  const clasificados = crit + warn + normal;
  const riskPct = clasificados ? Math.round((atRisk/clasificados)*100) : 0;
  const critPct = total ? (crit/total)*100 : 0;
  const warnPct = total ? (warn/total)*100 : 0;
  const normalPct = total ? (normal/total)*100 : 0;
  const nonTemporalFilters = chips.filter(chip => chip.facet !== "unidad" && chip.facet !== "fecha" && chip.facet !== "mes").length;
  const sub = `${scope?.label || "Última inspección"}${nonTemporalFilters ? ` · ${total} filtrados` : ""}`;

  document.getElementById("kpis").innerHTML = `
    <div class="fleet-overview">
      <div class="fo-total">
        <div class="fo-total-value num" id="foTotalValue">0</div>
        <div class="fo-total-label">Neumáticos inspeccionados</div>
        <div class="fo-total-sub">${sub}${sinDatos ? ` · ${sinDatos} sin datos de clasificación` : ""}</div>
      </div>
      <div class="fo-dist">
        <div class="fo-dist-label">Distribución por severidad</div>
        <div class="severity-bar" role="img"
             aria-label="${crit} críticos, ${warn} en observación, ${normal} normales, de ${total} neumáticos">
          <span class="sb-seg crit" id="segCrit"></span>
          <span class="sb-seg warn" id="segWarn"></span>
          <span class="sb-seg normal" id="segNormal"></span>
        </div>
        <div class="sb-legend">
          <span><span class="dot crit"></span>Críticos <b class="num">${crit}</b></span>
          <span><span class="dot warn"></span>Observación <b class="num">${warn}</b></span>
          <span><span class="dot normal"></span>Normales <b class="num">${normal}</b></span>
        </div>
      </div>
      <div class="fo-risk">
        <div class="risk-ring" id="riskRing"><span class="rr-value num" id="riskRingValue">0%</span></div>
        <div class="fo-risk-text">
          <div class="fo-risk-label">Riesgo del conjunto</div>
          <div class="fo-risk-sub">${atRisk} de ${clasificados || total} neumáticos</div>
        </div>
      </div>
    </div>`;

  animateCount(document.getElementById("foTotalValue"), total, {duration:500});
  animateCount(document.getElementById("riskRingValue"), riskPct, {duration:700, format:v=>Math.round(v)+"%"});
  growFill(document.getElementById("segCrit"), critPct, "flexBasis");
  growFill(document.getElementById("segWarn"), warnPct, "flexBasis");
  growFill(document.getElementById("segNormal"), normalPct, "flexBasis");
  animateRing(document.getElementById("riskRing"), riskPct, 700);
}

function tireCardIdentity(tire){
  return tire.tireCode || tire.casingCode || "SIN CÓDIGO";
}

function renderGrid(tires, chips, scope){
  currentResultTires = tires;
  const grid = document.getElementById("fleetGrid");
  document.getElementById("gridTitle").textContent = `Neumáticos inspeccionados · ${tires.length} · ${scope?.label || "Última inspección"}`;

  if(!tires.length){
    grid.innerHTML = `<div class="empty">${chips.length
      ? "Ningún neumático coincide con estos filtros."
      : "Sin neumáticos inspeccionados todavía."}</div>`;
    return;
  }

  // Orden: críticos primero, luego observación, sin datos, normales; dentro, por RTD ascendente.
  const rank = {critical:0, warning:1, no_data:2, normal:3};
  const sorted = tires.map((t,i)=>({t,i})).sort((a,b)=>{
    const ra = rank[a.t.tireStatus] ?? 2, rb = rank[b.t.tireStatus] ?? 2;
    return ra !== rb ? ra - rb : (a.t.rtdMoviMm ?? Infinity) - (b.t.rtdMoviMm ?? Infinity);
  });

  grid.innerHTML = sorted.map(({t,i},idx)=>{
    const status = t.tireStatus;
    const delay = Math.min(idx * 18, 260);
    const identity = tireCardIdentity(t);
    const modelLine = [t.brand_name, t.model_name, t.size_name].filter(Boolean).join(" ");
    const retreadLine = t.retreadObservation
      ? `<div class="uc-retread">${RETREAD_LABEL[t.retreadObservation] || t.retreadObservation}${t.discardReason ? ` · ${t.discardReason}` : ""}</div>` : "";
    const historyNote = t.casingCode
      ? ""
      : `<div class="uc-history-note">Sin historial · falta vincular casco</div>`;
    return `<button class="unit-card pressable status-${status}"
              style="animation-delay:${delay}ms"
              onclick="openResultRow(${i})"
              aria-label="${identity}, unidad ${t.plate}, posición ${t.pos}, estado ${STATUS_LABEL[status]}. Abrir inspección.">
      <div class="uc-top">
        <div>
          <div class="uc-plate">${identity}</div>
          <div class="uc-meta">${t.plate} · ${t.pos} · ${formatDate(t.inspectedOn)}</div>
        </div>
        <span class="uc-dot"></span>
      </div>
      <div class="uc-config">${modelLine || "—"}</div>
      ${retreadLine}
      ${historyNote}
      <div class="uc-status">${STATUS_LABEL[status]}</div>
    </button>`;
  }).join("");
}

function renderAll(tires, chips, scope = CURRENT_SCOPE){
  renderKpis(tires, chips, scope);
  renderGrid(tires, chips, scope);
}

/* Puente hacia el script de módulo de abajo (filtros facetados, task_06):
   mismo patrón que ya usa el buscador (window.onRenovaSupabaseReady) y que
   task_05 dejó en rendimiento.html. */
window.RenovaInspecciones = {
  getTires: () => TIRE_ROWS,
  mapRows: buildTireInspectionRowsFromSupabase,
  getScope: () => CURRENT_SCOPE,
  setRows(rows, scope){
    TIRE_ROWS = buildTireInspectionRowsFromSupabase(rows);
    CURRENT_SCOPE = scope || CURRENT_SCOPE;
    this.onDataLoaded?.();
  },
  renderResults: renderAll,
  renderNoData,
  formatDate,
  onDataLoaded: null,
};

// init — solo datos reales desde Supabase/Excel.
renderNoData("Cargando datos del Excel desde Supabase...");
</script>
<script type="module">
import { createFinderController } from "./buscador/finder-controller.js";
import { createFilterBar } from "./shared/filter-bar.js";
import { applyFilters, distinctValues } from "./shared/filter-facets.js";
import {
  distinctInspectionExactDateValues,
  distinctInspectionMonthValues,
  formatInspectionMonth,
  matchInspectionMonthFacet,
} from "./shared/inspection-date-facets.js";
import {
  createInspectionScopeIndex,
  postgrestFilterForScope,
  resolveInspectionScope,
} from "./shared/inspection-scope.js";

const finderTrigger = document.querySelector("[data-finder-trigger]");
const finderReady = new Promise((resolve) => {
  window.onRenovaSupabaseReady(() => resolve(createFinderController()));
});
const openFinder = async () => (await finderReady).open(finderTrigger);
finderTrigger.addEventListener("click", () => void openFinder());
document.addEventListener("keydown", (event) => {
  if (event.key.toLowerCase() !== "k" || (!event.ctrlKey && !event.metaKey)) return;
  if (event.target?.closest?.("input, textarea, select, [contenteditable='true']")) return;
  event.preventDefault();
  void openFinder();
});

/* ─────────────────────────────────────────────────────────────────────────
   Filtros facetados de Inspecciones (F4, tasks_filtros_facetados/task_06).
   Facetas de CONTRATOS_DATOS.md §3: unidad, código de neumático (por ambos
   códigos ante code_mismatch), estado, fecha, mes, observación de reencauche.
   Ambos mapas de etiqueta (STATUS_LABEL/RETREAD_LABEL) viven en el script
   clásico de arriba — se re-declaran acá solo los valores, no la lógica de
   negocio, porque el módulo no puede leer el scope clásico por closure.
   ───────────────────────────────────────────────────────────────────────── */
const INSPECCIONES_STATUS_LABEL = { critical: "Crítica", warning: "Observación", normal: "Normal", no_data: "Sin datos" };
const INSPECCIONES_RETREAD_LABEL = { para_reencauche: "Para reencauche", proximo_a_reencauche: "Próximo a reencauche", desecho: "Desecho" };
const INSPECCIONES_RETREAD_ACTIONS = ["Para reencauche", "Próximo a reencauche"];
let inspectionScopeIndex = createInspectionScopeIndex([], []);
let inspectionFacetRows = [];
let inspectionFacetSourceRows = [];
let facetCatalogPromise = null;
let loadedScopeSignature = "";
let scopeRequestSequence = 0;

function distinctTireCodes(rows){
  const codes = new Set([...distinctValues(rows, "tireCode"), ...distinctValues(rows, "casingCode")]);
  return [...codes].sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }));
}

function distinctLabeled(rows, column, labelMap){
  const seen = new Set();
  for (const row of rows) {
    const raw = row?.[column];
    if (raw != null && labelMap[raw]) seen.add(labelMap[raw]);
  }
  return [...seen].sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }));
}

const INSPECCIONES_FACETS = [
  {
    key: "unidad", label: "Unidad",
    // Índice liviano: ofrece todas las unidades inspeccionadas sin descargar
    // todas sus mediciones históricas.
    values: () => inspectionScopeIndex.plates,
    match: (row, v) => row.plate === v,
  },
  {
    key: "codigo", label: "Código de neumático",
    values: (r) => distinctTireCodes(r),
    // code_mismatch (fase anterior): busca por tireCode O casingCode, nunca solo uno.
    match: (row, v) => row.tireCode === v || row.casingCode === v,
  },
  {
    key: "estado", label: "Estado",
    values: (r) => distinctLabeled(r, "tireStatus", INSPECCIONES_STATUS_LABEL),
    match: (row, v) => INSPECCIONES_STATUS_LABEL[row.tireStatus] === v,
  },
  { key: "marca", label: "Marca", values: (r) => distinctValues(r, "brand_name"), match: (row, v) => row.brand_name === v },
  { key: "modelo", label: "Modelo", values: (r) => distinctValues(r, "model_name"), match: (row, v) => row.model_name === v },
  { key: "medida", label: "Medida", values: (r) => distinctValues(r, "size_name"), match: (row, v) => row.size_name === v },
  { key: "condicion", label: "Condición", values: (r) => distinctValues(r, "condition"), match: (row, v) => row.condition === v },
  { key: "diseno", label: "Diseño de reencauche", values: (r) => distinctValues(r, "retread_design"), match: (row, v) => row.retread_design === v },
  { key: "eje", label: "Eje", values: (r) => distinctValues(r, "axleName"), match: (row, v) => row.axleName === v },
  {
    // Va antes de las fechas exactas para que al escribir un mes la acción
    // mensual sea visible aunque haya decenas de inspecciones ese mes.
    key: "mes", label: "Mes de inspección",
    values: () => distinctInspectionMonthValues(inspectionScopeIndex.rows, "inspectedOn"),
    match: (row, v) => matchInspectionMonthFacet(row, v, "inspectedOn"),
  },
  {
    key: "fecha", label: "Fecha de inspección",
    values: () => distinctInspectionExactDateValues(inspectionScopeIndex.rows, "inspectedOn"),
    match: (row, v) => row.inspectedOn === v || window.RenovaInspecciones.formatDate(row.inspectedOn) === v,
  },
  {
    // Acciones de desgaste disponibles aunque el corte actual no tenga una
    // fila en cada estado: permiten buscar directamente "para reencauche".
    key: "reencauche", label: "Estado de reencauche",
    values: () => INSPECCIONES_RETREAD_ACTIONS,
    match: (row, v) => INSPECCIONES_RETREAD_LABEL[row.retreadObservation] === v,
  },
  {
    // Separado para que escribir "desecho" no se confunda con el desgaste
    // recuperable. La semántica la entrega la vista (catálogo + descarte manual).
    key: "desecho", label: "Desecho",
    values: () => ["Desecho"],
    match: (row, v) => v === "Desecho" && row.retreadObservation === "desecho",
  },
];
const INSPECCIONES_FACET_BY_KEY = new Map(INSPECCIONES_FACETS.map((facet) => [facet.key, facet]));

function chipsFromLocation(){
  const params = new URLSearchParams(location.search);
  const chips = [];
  for(const facet of INSPECCIONES_FACETS){
    for(const value of params.getAll(facet.key)){
      if(value) chips.push({ facet: facet.key, value, label: `${facet.label}: ${value}` });
    }
  }
  return chips;
}

function urlForChips(chips){
  const url = new URL(location.href);
  url.search = "";
  for(const chip of chips){
    if(INSPECCIONES_FACET_BY_KEY.has(chip.facet)) url.searchParams.append(chip.facet, chip.value);
  }
  return url;
}

let inspeccionesChips = chipsFromLocation();

function currentTires(){
  return window.RenovaInspecciones?.getTires?.() ?? [];
}

function facetRows(){
  return inspectionFacetRows.length ? inspectionFacetRows : currentTires();
}

function refreshResults(){
  const filtered = applyFilters(currentTires(), inspeccionesChips, INSPECCIONES_FACETS);
  window.RenovaInspecciones?.renderResults?.(
    filtered,
    inspeccionesChips,
    window.RenovaInspecciones?.getScope?.(),
  );
}

function scopeSignature(scope){
  return `${scope.column || ""}:${(scope.values || []).join(",")}`;
}

async function loadRowsForScope(scope, { force = false } = {}){
  const signature = scopeSignature(scope);
  if(!force && signature === loadedScopeSignature){
    refreshResults();
    return;
  }
  const requestId = ++scopeRequestSequence;
  const filter = postgrestFilterForScope(scope);
  if(!filter){
    loadedScopeSignature = signature;
    window.RenovaInspecciones.setRows([], scope);
    return;
  }
  let rows;
  if(scope.kind === "fleet-latest" && inspectionFacetSourceRows.length){
    rows = inspectionFacetSourceRows;
  }else{
    const params = { order: "inspected_on.desc,plate.asc,position_number.asc" };
    params[filter.column] = filter.value;
    rows = await RenovaSupabase.fetchView("v_inspection_dashboard_rows", params);
  }
  if(requestId !== scopeRequestSequence) return; // respuesta vieja: no pisa un filtro más reciente
  loadedScopeSignature = signature;
  window.RenovaInspecciones.setRows(rows, scope);
  const session = await RenovaSupabase.getSession();
  RenovaSupabase.showBadge("supabase", rows[0]?.company_name || session?.user?.email || "");
}

async function loadFacetCatalog(){
  if(inspectionFacetSourceRows.length) return;
  if(facetCatalogPromise) return facetCatalogPromise;
  facetCatalogPromise = RenovaSupabase.fetchView("v_inspection_latest_facets", {
    order: "plate.asc,position_number.asc",
  }).then((rows) => {
    inspectionFacetSourceRows = rows;
    inspectionFacetRows = window.RenovaInspecciones.mapRows(rows);
    filterBar.setRows(facetRows());
  }).finally(() => { facetCatalogPromise = null; });
  return facetCatalogPromise;
}

async function applyTemporalScope({ force = false } = {}){
  const scope = resolveInspectionScope(
    inspectionScopeIndex,
    inspeccionesChips,
    (iso) => window.RenovaInspecciones.formatDate(iso),
    formatInspectionMonth,
  );
  await loadRowsForScope(scope, { force });
}

async function reloadInspectionIndexAndRows(){
  // Realtime vuelve a entrar aquí: el caché vive solo en memoria y se invalida
  // antes de resolver el nuevo último estado.
  inspectionFacetRows = [];
  inspectionFacetSourceRows = [];
  facetCatalogPromise = null;
  const [inspections, units] = await Promise.all([
    RenovaSupabase.fetchView("inspections", {
      select: "id,unit_id,inspected_on,created_at",
      order: "inspected_on.desc,created_at.desc",
      limit: "1000",
    }),
    RenovaSupabase.fetchView("units", { select: "id,plate", order: "plate.asc" }),
  ]);
  if(inspections.length >= 1000){
    throw new Error("El índice de inspecciones alcanzó 1000 filas; requiere paginación o una vista resumida antes de continuar.");
  }
  inspectionScopeIndex = createInspectionScopeIndex(inspections, units);
  if(!inspectionScopeIndex.rows.length){
    window.RenovaInspecciones.renderNoData("Sin datos del Excel para tu empresa todavía.");
    const session = await RenovaSupabase.getSession();
    RenovaSupabase.showBadge("supabase", session?.user?.email || "");
    return;
  }
  const nextScope = resolveInspectionScope(
    inspectionScopeIndex, inspeccionesChips,
    (iso) => window.RenovaInspecciones.formatDate(iso), formatInspectionMonth,
  );
  if(nextScope.kind === "fleet-latest") await loadFacetCatalog();
  await applyTemporalScope({ force: true });
}

const filterBar = createFilterBar({
  mount: document.getElementById("filterMount"),
  facets: INSPECCIONES_FACETS,
  rows: currentTires(),
  chips: inspeccionesChips,
  onOpen(){
    // El catálogo analítico es opcional para la carga inicial. Si una versión
    // remota todavía no tiene la vista nueva, conserva visible la última
    // inspección en lugar de reemplazar toda la pantalla por un error.
    void loadFacetCatalog().catch((error) => {
      console.warn("Inspecciones: catálogo analítico no disponible todavía.", error);
    });
  },
  onChange(nextChips){
    inspeccionesChips = nextChips;
    history.pushState({ inspeccionesChips }, "", urlForChips(inspeccionesChips));
    void applyTemporalScope().catch(handleLoadError);
  },
});

window.RenovaInspecciones.onDataLoaded = () => {
  filterBar.setRows(facetRows());
  refreshResults();
};

window.addEventListener("popstate", () => {
  inspeccionesChips = chipsFromLocation();
  filterBar.setChips(inspeccionesChips);
  void applyTemporalScope().catch(handleLoadError);
});

function handleLoadError(error){
  console.warn("Inspecciones: Supabase no disponible.", error);
  window.RenovaInspecciones.renderNoData("No se pudieron cargar las inspecciones desde Supabase.");
  RenovaSupabase.showBadge("empty");
}

window.onRenovaSupabaseReady(async () => {
  try{
    if(!RenovaSupabase.enabled){
      window.RenovaInspecciones.renderNoData("Supabase no configurado. No se muestran datos locales.");
      RenovaSupabase.showBadge("empty");
      return;
    }
    await RenovaSupabase.requireAuth();
    await reloadInspectionIndexAndRows();
    RenovaSupabase.onDataChange(["inspections", "inspection_measurements"], () => {
      void reloadInspectionIndexAndRows().catch(handleLoadError);
    });
  }catch(error){
    handleLoadError(error);
  }
});
</script>
</body>
</html>
