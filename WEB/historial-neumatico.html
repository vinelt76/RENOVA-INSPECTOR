<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RENOVA — Historial de Neumático</title>
<!--
  PANTALLA HISTORIAL DE NEUMÁTICO — vista de consulta (SOLO LECTURA), con
  datos REALES de Supabase (v_casing_history_summary, v_casing_installations,
  v_casing_inspections), protegidos por RLS de empresa.

  Es una VISTA APARTE, referenciada por LINK desde Inspección/Rendimiento:
  al hacer clic en el # Serie / Código de un neumático, esas pantallas navegan aquí
  pasando el código en la URL:
      historial-neumatico.html?serie=NEU-04533&from=rendimiento
      historial-neumatico.html?serie=NEU-04533&from=inspeccion
  Un solo historial, una sola lógica, referenciado desde todos los orígenes.

  Reglas respetadas:
    · Km acumulado = vida completa del casco (lifetime_km, derivado en SQL a
      partir de eventos reales; nunca calculado a mano en el navegador).
    · RTD actual por inspección = rtd_movi_mm ya calculado (MIN de canales).
    · Instalaciones e inspecciones ordenadas de más reciente a más antigua.
    · Vista de SOLO LECTURA: sin gráficos nuevos, sin formularios, sin edición.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<script src="supabase-config.public.js"></script>
<script src="renova-ready.js"></script>
<script type="module" src="supabase-demo.js"></script>
<style>
  :root{
    /* Paleta RENOVA (DESIGN.md) */
    --screen-dark:#07111C;
    --field-dark:#111E2E;
    --navy-brand:#15233f;
    --border-dark:#1B2D42;
    --label-blue:#7AABCC;
    --value-ice:#F0F8FF;
    --ember-orange:#F06822;
    --signal-yellow:#f4b821;
    --verified-green:#1f9d6b;

    --mono:'JetBrains Mono','IBM Plex Mono',SFMono-Regular,Menlo,monospace;
    --display:'Bebas Neue',sans-serif;
    color-scheme:dark;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    background:var(--screen-dark);
    color:var(--value-ice);
    font-family:var(--mono);
    font-weight:700;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
    padding-bottom:48px;
  }
  .num{font-variant-numeric:tabular-nums}

  /* ───────────────── Header ───────────────── */
  header{
    background:var(--navy-brand);
    padding:18px 16px 16px;
    position:sticky;top:0;z-index:20;
    border-bottom:4px solid transparent;
    border-image:repeating-linear-gradient(45deg,var(--ember-orange) 0 6px,transparent 6px 12px) 4;
  }
  .head-inner{max-width:860px;margin:0 auto}
  .brand .logo{
    font-family:var(--display);font-size:32px;line-height:1;
    letter-spacing:.06em;color:var(--value-ice);
  }
  .brand .logo b{color:var(--ember-orange);font-weight:400}
  .brand .screen-name{
    font-family:var(--display);font-size:19px;line-height:1;
    letter-spacing:.12em;color:var(--signal-yellow);margin-top:4px;
  }

  main{max-width:860px;margin:0 auto;padding:16px;flex:1 0 auto;width:100%}

  /* Botón volver (según origen) */
  .th-back{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--label-blue);background:var(--field-dark);
    border:2px solid var(--border-dark);border-radius:10px;
    padding:10px 14px;cursor:pointer;margin-bottom:16px;text-decoration:none;
    transition:border-color .15s ease-out,color .15s ease-out,transform .12s ease-out;
  }
  .th-back:hover{color:var(--value-ice);border-color:var(--label-blue)}
  .th-back:active{transform:scale(.97)}
  .th-back:focus-visible{outline:none;border-color:var(--ember-orange)}
  .th-back svg{width:14px;height:14px}

  .th-head{margin-bottom:4px}
  .th-title{
    font-family:var(--display);font-size:26px;letter-spacing:.1em;color:var(--value-ice);line-height:1;
  }
  .th-serie{
    font-size:22px;font-weight:800;letter-spacing:.04em;color:var(--ember-orange);margin-top:8px;
  }

  .th-section{margin-top:22px}
  .th-section-title{
    font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--label-blue);margin-bottom:11px;
  }

  .th-card{
    background:var(--field-dark);border:2px solid var(--border-dark);border-radius:14px;padding:16px 18px;
  }

  /* Identidad — grilla de campos */
  .th-idgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px}
  .th-field .f-label{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--label-blue)}
  .th-field .f-value{font-size:15px;font-weight:800;color:var(--value-ice);margin-top:6px}
  .th-badge{
    display:inline-block;font-size:13px;font-weight:800;letter-spacing:.04em;
    padding:3px 11px;border-radius:6px;border:2px solid var(--border-dark);color:var(--value-ice);
  }
  .th-badge.estado{border-color:var(--signal-yellow);color:var(--signal-yellow)}
  .th-badge.cond-instalado{border-color:var(--verified-green);color:var(--verified-green)}
  .th-badge.cond-retirado,.th-badge.cond-desechado{border-color:var(--ember-orange);color:var(--ember-orange)}
  .th-badge.cond-reten{border-color:var(--label-blue);color:var(--label-blue)}

  /* Resumen rápido — mini stats */
  .th-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .th-stat{background:var(--field-dark);border:2px solid var(--border-dark);border-radius:10px;padding:12px 14px}
  .th-stat .s-label{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--label-blue)}
  .th-stat .s-value{font-size:19px;font-weight:800;color:var(--value-ice);margin-top:6px}
  .th-stat .s-value small{font-size:11px;font-weight:700;color:var(--label-blue);margin-left:3px}
  .th-stat .s-value.muted{font-size:12px;font-weight:800;color:var(--label-blue);letter-spacing:.04em}

  /* Instalaciones */
  .th-list{display:flex;flex-direction:column;gap:10px}
  .th-inst{
    background:var(--field-dark);border:2px solid var(--border-dark);border-radius:12px;padding:13px 15px;
  }
  .th-inst .r-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .th-inst .r-plate{font-size:16px;font-weight:800;color:var(--value-ice);letter-spacing:.02em}
  .th-inst .r-km{font-size:15px;font-weight:800;color:var(--value-ice)}
  .th-inst .r-km small{font-size:10px;font-weight:700;color:var(--label-blue);margin-left:3px}
  .th-inst .r-dates{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--label-blue);margin-top:7px}
  .th-chip-actual{
    font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--verified-green);
    border:2px solid var(--verified-green);border-radius:6px;padding:2px 8px;
  }

  /* Inspecciones — cards apiladas (mobile-first); tabla compacta en desktop */
  .th-insp{
    background:var(--field-dark);border:2px solid var(--border-dark);border-radius:12px;padding:13px 15px;
  }
  .th-insp .i-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:9px}
  .th-insp .i-date{font-size:14px;font-weight:800;color:var(--value-ice)}
  .th-insp .i-loc{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--label-blue)}
  .th-metrics{display:flex;gap:20px;flex-wrap:wrap}
  .th-metrics .im .im-label{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--label-blue)}
  .th-metrics .im .im-value{font-size:16px;font-weight:800;color:var(--value-ice);margin-top:3px}
  .th-metrics .im .im-value small{font-size:10px;color:var(--label-blue);margin-left:2px}
  .th-obs{margin-top:10px;font-size:11px;font-weight:700;color:var(--signal-yellow);letter-spacing:.02em;line-height:1.4}

  .th-empty{
    border:2px dashed var(--border-dark);border-radius:12px;padding:26px 20px;text-align:center;
    color:var(--label-blue);font-size:12px;font-weight:700;line-height:1.6;
  }

  footer{
    max-width:860px;margin:28px auto 0;padding:0 16px;
    font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--label-blue);opacity:.7;text-align:center;line-height:1.6;
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
<link rel="stylesheet" href="renova-office-shell.css">
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">
      <div class="logo">RENOVA<b>·</b></div>
      <div class="screen-name">HISTORIAL DE NEUMÁTICO</div>
    </div>
  </div>
</header>

<main id="view"></main>

<footer>
  Datos reales de Supabase (RLS por empresa) · Vista de consulta (solo lectura) · Historial por # Serie / Código.
</footer>

<script>
/* =========================================================================
   PARÁMETROS DE URL — la llave (serie/código) y el origen (from) llegan por
   query string desde Inspección o Rendimiento.
   ========================================================================= */
const params = new URLSearchParams(location.search);
const serie  = (params.get("serie") || params.get("codigo") || "").trim();
const from   = (params.get("from") || "").toLowerCase();

/* =========================================================================
   DATOS REALES — cargados de Supabase por código de casco (# Serie/Código):
     v_casing_history_summary → identidad + estado + km/costo de vida
     v_casing_installations   → unidades donde estuvo instalado (histórico)
     v_casing_inspections     → inspecciones pasadas
   HISTORIAL[serie] se llena en load(); misma forma que usaba el mock, para
   no tocar el render de abajo.
   ========================================================================= */
let HISTORIAL = {};

function condicionDeEstado(inventoryStatus){
  if(inventoryStatus === "installed") return "Instalado";
  if(inventoryStatus === "in_inventory") return "En retén";
  if(inventoryStatus === "discarded") return "Descartado";
  return "—";
}

async function loadHistorial(code){
  const [summaryRows, instRows, inspRows] = await Promise.all([
    RenovaSupabase.fetchView("v_casing_history_summary", { select: "*", code: `eq.${code}` }),
    RenovaSupabase.fetchView("v_casing_installations", { select: "*", casing_code: `eq.${code}`, order: "installed_at.desc" }),
    RenovaSupabase.fetchView("v_casing_inspections", { select: "*", casing_code: `eq.${code}`, order: "inspected_on.desc" }),
  ]);
  const s = summaryRows[0];
  if(!s) return null;
  return {
    marca: s.brand_name,
    diseno: s.model_name,
    medida: s.size_name,
    estado: s.condition,
    condicion: condicionDeEstado(s.inventory_status),
    unidadActual: s.installed_plate || null,
    posActual: s.installed_position != null ? `P${s.installed_position}` : null,
    lifetimeKm: s.lifetime_km != null ? Number(s.lifetime_km) : null,
    lastRtd: s.last_rtd_mm != null ? Number(s.last_rtd_mm) : null,
    lastPressure: s.last_pressure_psi != null ? Number(s.last_pressure_psi) : null,
    lastInspectionOn: s.last_inspection_on || null,
    instalaciones: instRows.map(i => ({
      placa: i.plate, desde: i.installed_at,
      hasta: i.removed ? i.removed_at : null,
      km: i.km_run != null ? Number(i.km_run) : null,
    })),
    inspecciones: inspRows.map(i => ({
      fecha: i.inspected_on, placa: i.plate, posicion: i.position_number != null ? `P${i.position_number}` : "—",
      rtdMovi: i.rtd_movi_mm != null ? Number(i.rtd_movi_mm) : null,
      psi: i.pressure_psi != null ? Number(i.pressure_psi) : null,
      obs: i.anomaly || "",
    })),
  };
}


/* ───────── Formato ───────── */
const nf = new Intl.NumberFormat("es-PE");
const fmtKm = v => nf.format(Math.round(v));
const fmtMm = v => (Math.round(v*10)/10).toFixed(1);
function fmtDate(iso){
  if(!iso) return "—";
  const p = String(iso).split("-");
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : String(iso);
}
function condClass(c){
  const k = (c || "").toLowerCase();
  if(k.includes("instalado")) return "cond-instalado";
  if(k.includes("retén") || k.includes("reten")) return "cond-reten";
  if(k.includes("desech")) return "cond-desechado";
  if(k.includes("retir")) return "cond-retirado";
  return "";
}

/* =========================================================================
   NAVEGACIÓN DE VUELTA — según el origen (from). Si hay historial de
   navegación, vuelve atrás; si se abrió directo, enlaza al origen.
   ========================================================================= */
function backLabel(){
  return from === "inspeccion"  ? "Volver a Inspección"
       : from === "rendimiento" ? "Volver a Rendimiento"
       : "Volver";
}
function goBack(){
  if(document.referrer && history.length > 1){ history.back(); return; }
  const map = { rendimiento:"rendimiento.html", inspeccion:"UI/renova_dashboard_taller_v1.html" };
  location.href = map[from] || "rendimiento.html";
}

/* =========================================================================
   RENDER
   ========================================================================= */
function render(){
  const mount = document.getElementById("view");
  const backBtn = `
    <button class="th-back" type="button" onclick="goBack()">
      <svg viewBox="0 0 20 12" fill="none"><path d="M8 2L2 6l6 4M2 6h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ${backLabel()}
    </button>`;
  const head = `
    <div class="th-head">
      <div class="th-title">Historial de Neumático</div>
      <div class="th-serie num">${serie || "—"}</div>
    </div>`;

  const h = HISTORIAL[serie];

  // Estado vacío global: la serie no existe / no se pasó código.
  if(!h){
    mount.innerHTML = backBtn + head +
      `<div class="th-section"><div class="th-empty">No hay historial registrado para este neumático.</div></div>`;
    return;
  }

  const instalaciones = (h.instalaciones || []).slice()
    .sort((a,b) => String(b.desde||"").localeCompare(String(a.desde||"")));
  const inspecciones  = (h.inspecciones || []).slice()
    .sort((a,b) => String(b.fecha||"").localeCompare(String(a.fecha||"")));

  // Resumen rápido. Km acumulado = vida completa del casco (SQL, no se recalcula acá).
  const kmAcum   = h.lifetimeKm;
  const lastInsp = inspecciones[0] || null;
  const rtdMin   = h.lastRtd;
  const psi      = h.lastPressure;

  const kmAcumStr = kmAcum != null
    ? `<span class="s-value num">${fmtKm(kmAcum)}<small>km</small></span>`
    : `<span class="s-value muted">Sin datos</span>`;
  const rtdStr = rtdMin != null
    ? `<span class="s-value num">${fmtMm(rtdMin)}<small>mm</small></span>`
    : `<span class="s-value muted">Sin datos</span>`;
  const psiStr = psi != null
    ? `<span class="s-value num">${psi}<small>psi</small></span>`
    : `<span class="s-value muted">Sin datos</span>`;

  const identity = `
    <div class="th-section">
      <div class="th-section-title">Identidad</div>
      <div class="th-card">
        <div class="th-idgrid">
          <div class="th-field"><div class="f-label">Serie / Código</div><div class="f-value num">${serie}</div></div>
          <div class="th-field"><div class="f-label">Marca</div><div class="f-value">${h.marca || "—"}</div></div>
          <div class="th-field"><div class="f-label">Diseño / Modelo</div><div class="f-value">${h.diseno || "—"}</div></div>
          <div class="th-field"><div class="f-label">Medida</div><div class="f-value num">${h.medida || "—"}</div></div>
          <div class="th-field"><div class="f-label">Estado actual</div><div class="f-value"><span class="th-badge estado">${h.estado || "—"}</span></div></div>
          <div class="th-field"><div class="f-label">Condición actual</div><div class="f-value"><span class="th-badge ${condClass(h.condicion)}">${h.condicion || "—"}</span></div></div>
        </div>
      </div>
    </div>`;

  const resumen = `
    <div class="th-section">
      <div class="th-section-title">Resumen rápido</div>
      <div class="th-summary">
        <div class="th-stat"><div class="s-label">Km acumulado</div>${kmAcumStr}</div>
        <div class="th-stat"><div class="s-label">Última inspección</div><span class="s-value num">${fmtDate(h.lastInspectionOn)}</span></div>
        <div class="th-stat"><div class="s-label">RTD actual (mín.)</div>${rtdStr}</div>
        <div class="th-stat"><div class="s-label">PSI actual</div>${psiStr}</div>
        <div class="th-stat"><div class="s-label">Unidad actual</div><span class="s-value">${h.unidadActual || "—"}</span></div>
        <div class="th-stat"><div class="s-label">Posición actual</div><span class="s-value">${h.posActual || "—"}</span></div>
      </div>
    </div>`;

  // Unidades donde estuvo instalado.
  const instList = instalaciones.map(i => {
    const hasta = i.hasta
      ? fmtDate(i.hasta)
      : `<span class="th-chip-actual">Instalado actualmente</span>`;
    const km = i.km != null ? `${fmtKm(i.km)}<small>km</small>` : "—";
    return `
      <div class="th-inst">
        <div class="r-top">
          <span class="r-plate">${i.placa || "—"}</span>
          <span class="r-km num">${km}</span>
        </div>
        <div class="r-dates">${fmtDate(i.desde)} → ${hasta}</div>
      </div>`;
  }).join("");
  const instBlock = `
    <div class="th-section">
      <div class="th-section-title">Unidades donde estuvo instalado</div>
      ${instalaciones.length
        ? `<div class="th-list">${instList}</div>`
        : `<div class="th-empty">Hay inspecciones registradas, pero no se encontró historial de instalación asociado.</div>`}
    </div>`;

  // Inspecciones pasadas — RTD = MIN de canales de remanente.
  const inspList = inspecciones.map(ins => {
    const rtd = ins.rtdMovi;
    const obs = ins.obs ? `<div class="th-obs">${ins.obs}</div>` : "";
    return `
      <div class="th-insp">
        <div class="i-top">
          <span class="i-date num">${fmtDate(ins.fecha)}</span>
          <span class="i-loc">${ins.placa || "—"} · ${ins.posicion || "—"}</span>
        </div>
        <div class="th-metrics">
          <div class="im"><div class="im-label">RTD actual</div><div class="im-value num">${rtd != null ? fmtMm(rtd) : "—"}<small>mm</small></div></div>
          <div class="im"><div class="im-label">PSI</div><div class="im-value num">${ins.psi != null ? ins.psi : "—"}<small>psi</small></div></div>
        </div>
        ${obs}
      </div>`;
  }).join("");
  const inspBlock = `
    <div class="th-section">
      <div class="th-section-title">Inspecciones pasadas</div>
      ${inspecciones.length
        ? `<div class="th-list">${inspList}</div>`
        : `<div class="th-empty">Este neumático existe en el sistema, pero aún no tiene inspecciones registradas.</div>`}
    </div>`;

  mount.innerHTML = backBtn + head + identity + resumen + instBlock + inspBlock;
}

function renderLoading(){
  document.getElementById("view").innerHTML = `
    <button class="th-back" type="button" onclick="goBack()">Volver</button>
    <div class="th-head"><div class="th-title">Historial de Neumático</div><div class="th-serie num">${serie || "—"}</div></div>
    <div class="th-section"><div class="th-empty">Cargando historial desde Supabase…</div></div>`;
}

async function init(){
  if(!serie){
    HISTORIAL = {};
    render();
    return;
  }
  if(!(window.RenovaSupabase && RenovaSupabase.enabled)){
    document.getElementById("view").innerHTML =
      `<div class="th-section"><div class="th-empty">Supabase no configurado. No se puede consultar el historial.</div></div>`;
    return;
  }
  renderLoading();
  try{
    await RenovaSupabase.requireAuth();
    const h = await loadHistorial(serie);
    HISTORIAL = h ? { [serie]: h } : {};
    render();
  }catch(err){
    console.warn("Historial: no se pudo cargar Supabase.", err);
    document.getElementById("view").innerHTML =
      `<div class="th-section"><div class="th-empty">No se pudo cargar el historial desde Supabase.</div></div>`;
  }
}
onRenovaSupabaseReady(init);
</script>
</body>
</html>
